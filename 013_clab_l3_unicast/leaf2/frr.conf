vrf red
 vni 100
exit-vrf
vrf blue
 vni 101
exit-vrf
!
router bgp 64512
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast

 neighbor 192.168.1.2 remote-as 64612
 neighbor 192.168.1.2 allowas-in origin
 !
 address-family ipv4 unicast
  neighbor 192.168.1.2 activate
  network 100.64.0.2/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.1.2 activate
  neighbor 192.168.1.2 allowas-in origin
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!
router bgp 64512 vrf red
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf route-map rm_import_connected
  import vrf blue
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
router bgp 64512 vrf blue
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf route-map rm_import_connected
  import vrf red
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
route-map rm_import_connected permit 10
 match ip next-hop address 0.0.0.0
exit
!
route-map rm_export_connected permit 10
 match source-protocol connected
exit
!
